<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Übergabemoment – Fahrzeugübergabe</title>
  <link rel="stylesheet" href="assets/css/animation-themes.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      font-family: sans-serif;
    }

    #fullscreen-video {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -1;
      transition: filter 1s ease;
    }

    /* Play/Pause Button */
    #playPauseButton {
      position: absolute;
      bottom: 5vh;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.3);
      color: rgba(255, 255, 255, 0.7);
      font-size: clamp(16px, 3vw, 24px);
      padding: 10px 20px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      opacity: 0.5;
      transition: opacity 0.3s ease;
      z-index: 2;
    }

    #playPauseButton:hover {
      opacity: 1;
      background: rgba(0, 0, 0, 0.6);
    }

    #playPauseButton:focus {
      outline: none;
    }

    /* Feedback Button */
    #feedbackButton {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(255, 255, 255, 0.9);
      color: #000;
      font-size: clamp(20px, 4vw, 36px);
      padding: 20px 40px;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      opacity: 0;
      transition: opacity 1s ease, transform 0.5s ease;
      z-index: 3;
    }

    #feedbackButton.show {
      display: block;
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    #fullscreen-video.blurred {
      filter: blur(8px) brightness(0.6);
    }

    #startOverlay {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: rgba(0, 0, 0, 0.72);
      color: #fff;
      text-align: center;
    }

    #startOverlay.hidden { display: none; }
    #startOverlay p { margin: 0; font-size: clamp(16px, 2.5vw, 24px); }

    #startShowButton {
      padding: 16px 30px;
      border: 3px solid #fff;
      border-radius: 50px;
      background: transparent;
      color: #fff;
      cursor: pointer;
      font-size: clamp(20px, 4vw, 36px);
      font-weight: 700;
      text-transform: uppercase;
    }

    #startShowButton:hover { background: #fff; color: #000; }
    #audioNotice { min-height: 20px; color: #ffd7d7; font-size: 14px; }
    #startOverlay { isolation: isolate; justify-content: flex-start; }
    #video-bg { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -1; filter: brightness(.3); }
    #startOverlay .start-card { width: min(100%, 850px); margin: auto; flex-shrink: 0; padding: 20px 0; }
    #startOverlay .greeting { font-size: clamp(28px, 4vw, 60px); text-transform: uppercase; white-space: pre-line; overflow-wrap: anywhere; }
    #startOverlay .message { font-size: clamp(23px, 3vw, 43px); white-space: pre-line; text-transform: uppercase; }
    #startOverlay .thank-you { font-size: clamp(16px, 2vw, 26px); text-transform: uppercase; }
    @media (prefers-reduced-motion: reduce) { #video-bg { display: none; } }
    </style>
    <link rel="stylesheet" href="assets/css/show-layout.css">
</head>
<body class="show-page">

  <video id="fullscreen-video" preload="metadata" playsinline>
    <source src="assets/videos/your-background-video2.mp4" type="video/mp4">
  </video>

  <audio id="showAudio" preload="auto" loop></audio>
  <div class="show-effects" aria-hidden="true"></div>

  <div id="startOverlay">
    <video id="video-bg" autoplay muted loop playsinline aria-hidden="true">
      <source src="assets/videos/your-background-video1.mp4" type="video/mp4">
    </video>
    <div class="content start-card">
      <img class="brand-logo" src="assets/images/Logo.png" alt="Autohaus DIL">
      <h1 id="greeting" class="greeting">Herzlich willkommen!</h1>
      <p class="thank-you">Vielen Dank für Ihren Kauf bei uns.</p>
      <p id="message" class="message"></p>
      <button id="startShowButton" type="button">Show starten</button>
      <button id="originalAudioButton" hidden class="secondary-button" type="button">Mit Originalton starten</button>
      <button class="secondary-button" onclick="navigateWithAnimation('index.html')">Zurück zur Auswahl</button>
    </div>
  </div>
  <p id="audioNotice" role="status" aria-live="polite"></p>

  <button id="playPauseButton" hidden type="button">Pause</button>
  <button id="feedbackButton" onclick="goToFeedback()">Ihre Meinung zählt!</button>
  <button id="restartLink" class="secondary-button" hidden onclick="navigateWithAnimation('index.html')">Neue Show</button>

  <script src="assets/js/animation-themes.js?v=greeting-3"></script>
  <script src="assets/js/music-picker.js?v=fade6-refresh-20261029"></script>
  <script src="assets/js/show-player.js?v=fade6-refresh-20261029"></script>
  <script>
    function goToFeedback() {
      window.location.href = "https://forms.office.com/Pages/ResponsePage.aspx?id=S1QrxhwPRkW0nsIpeJqmmGlyfABJLS1BqSlU7IxfesJUN1lOS1pGQUZXMlJKUEgxS00xM05aTFFBRi4u";
    }

  </script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const anrede = (readShowSetting('Anrede') || '').trim();
            const name = (readShowSetting('Name') || '').trim();
            const customer = [anrede, name].filter(Boolean).join(' ');

            document.getElementById('greeting').textContent = name
                ? `Herzlich willkommen,\n${customer}!`
                : 'Herzlich willkommen!';
            document.getElementById('message').textContent = "Ihr Auto steht bereit\nzur Abholung!";
        });
    </script>
</body>
</html>
